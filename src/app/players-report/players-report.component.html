<mat-card style="padding: 20px; margin: 20px;">
  <div
    style="display: flex; justify-content: space-between; align-items: center"
  >
    <mat-tab-group (selectedTabChange)="updateDisplayedPlayers($event)">
      <mat-tab label="All"></mat-tab>
      <mat-tab label="Need Help"></mat-tab>
    </mat-tab-group>
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input
        matInput
        type="text"
        placeholder="Search"
        [(ngModel)]="searchPlayerName"
        (ngModelChange)="filterPlayers()"
      />
      <button
        matSuffix
        mat-icon-button
        aria-label="Clear"
        (click)="clearSearch()"
        *ngIf="searchPlayerName"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>
  <table
    mat-table
    [dataSource]="filteredPlayers"
    matSort
    (matSortChange)="sortData($event)"
  >
    <ng-container matColumnDef="nickname">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="centered">
        Nickname
      </th>
      <td mat-cell *matCellDef="let player" class="centered"  (click)="logPlayer(player)">
        {{ player.username }}
      </td>
    </ng-container>
    <ng-container matColumnDef="rank">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="centered">
        Rank
      </th>
      <td mat-cell *matCellDef="let player" class="centered">
        {{ player.rank }}
      </td>
    </ng-container>
    <ng-container matColumnDef="correctAnswers">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="centered">
        Correct Answers
      </th>
      <td mat-cell *matCellDef="let player" class="centered">
        {{ (player.correctAnswersCount / (player.answersCount + player.unansweredCount)) * 100 }}%
      </td>
    </ng-container>
    <ng-container matColumnDef="unanswered">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="centered">
        Unanswered
      </th>
      <td mat-cell *matCellDef="let player" class="centered">
        {{ player.unansweredCount }}
      </td>
    </ng-container>
    <ng-container matColumnDef="finalScore">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="centered">
        Final Score
      </th>
      <td mat-cell *matCellDef="let player" class="centered">
        {{ player.points }}
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
