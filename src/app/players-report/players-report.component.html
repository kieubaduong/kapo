<div style="padding: 20px">
  <div
    style="display: flex; justify-content: space-between; align-items: center"
  >
    <mat-tab-group (selectedTabChange)="updateDisplayedPlayers($event)">
      <mat-tab label="All"></mat-tab>
      <mat-tab label="Need Help"></mat-tab>
    </mat-tab-group>
    <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput type="text" placeholder="Search" [(ngModel)]="searchPlayerName" />
        <button matSuffix mat-icon-button aria-label="Clear" (click)="searchPlayerName = ''" *ngIf="searchPlayerName">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
  </div>
  <table mat-table [dataSource]="displayedPlayers" matSort (matSortChange)="sortData($event)">
    <ng-container matColumnDef="nickname">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nickname</th>
      <td mat-cell *matCellDef="let player">{{ player.nickname }}</td>
    </ng-container>
    <ng-container matColumnDef="rank">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rank</th>
      <td mat-cell *matCellDef="let player">{{ player.rank }}</td>
    </ng-container>
    <ng-container matColumnDef="correctAnswers">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Correct Answers</th>
      <td mat-cell *matCellDef="let player">{{ player.correctAnswers }}%</td>
    </ng-container>
    <ng-container matColumnDef="unanswered">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Unanswered</th>
      <td mat-cell *matCellDef="let player">{{ player.unanswered }}</td>
    </ng-container>
    <ng-container matColumnDef="finalScore">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Final Score</th>
      <td mat-cell *matCellDef="let player">{{ player.finalScore }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
