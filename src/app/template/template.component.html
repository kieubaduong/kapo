<div style="display: flex; background-color: #f9f9f9">
  <div style="display: flex; flex-direction: column; width: 400px;">
    <img
      [src]="template.cover"
      style="width: 400px; height: 250px"
    />
    <p style="font-size: 24px; font-weight: 700; margin: 10px"> {{ template.title }} </p>
    <div
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <p
        style="margin: 0px; margin-left: 10px; font-size: 12px; color: #737373"
      >
        {{ template.gameCount }} players
      </p>
      <div>
        <button mat-icon-button>
          <mat-icon class="material-icons-outlined">edit_outlined</mat-icon>
        </button>
        <button mat-icon-button>
          <mat-icon class="material-icons-outlined"
            >star_border_outlined</mat-icon
          >
        </button>
        <button mat-icon-button>
          <mat-icon>more_vert</mat-icon>
        </button>
      </div>
    </div>
    <div
      style="
        display: flex;
        justify-content: space-around;
        padding: 0px 20px 0px 20px;
      "
    >
      <button mat-raised-button color="primary" style="flex: 1">Start</button>
    </div>
    <p style="margin: 10px; font-weight: 500; color: #6e6e6e"> {{ template.description }} </p>
    <div style="display: flex; align-items: center">
      <img
        [src]="template.creator.avatar"
        (error)="this.template.creator.avatar = mockImage"
        style="border-radius: 50%; width: 35px; height: 35px; margin: 10px"
      />
      <p style="margin: 0px; font-size: 12px; font-weight: 700"> {{template.creator.username}} </p>
    </div>
  </div>
  <div style="flex: 1; padding: 20px">
    <div style="display: flex; justify-content: space-between">
      <p style="font-size: 16px; font-weight: 700">Questions ({{ template.questions.length }})</p>
      <p (click)="showAnswers()" style="font-weight: 700; text-decoration: underline; cursor: pointer">
        Show answers
      </p>
    </div>
    <!-- component.html -->
    <app-question
      *ngFor="let question of template.questions, let i = index"
      [index]="i"
      [question]="question"
      [isCollapsed]="isCollapsed[i]"
      (toggle)="isCollapsed[i] = $event"
    ></app-question>
  </div>
</div>
