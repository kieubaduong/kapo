<div
  class="item-rest"
  [style.border]="selected ? '3px solid #3f51b5' : 'none'"
  [style.backgroundColor]="selected ? 'white' : '#e9e9e9'"
  style="
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 5px;
  "
>
  <div
    style="
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.75rem;
      text-align: center;
      color: #6e6e6e;
      line-height: 0.75rem;
    "
  >
    {{ title ?? "Title" }}
  </div>
  <div style="display: flex; justify-content: center; align-items: center">
    <div style="flex-grow: 1; display: flex; justify-content: center">
      <img
        [src]="imgUrl ?? '../../../assets/image-place-holder.png'"
        alt="Placeholder"
        style="height: 28px; width: 28px"
      />
    </div>
  </div>
  <div style="display: flex; justify-content: center">
    <div
      style="
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      "
    >
      <p
        style="
          padding: 0px;
          margin: 0px;
          color: #6e6e6e;
          font-size: 0.75rem;
          line-height: 12px;
          overflow: hidden;
          text-overflow: ellipsis;
        "
      >
        {{ content ?? "Type text" }}
      </p>
    </div>
  </div>
</div>
